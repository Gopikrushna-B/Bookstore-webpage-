<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your cart — Chapter &amp; Verse</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="mark"></span>Chapter &amp; Verse</a>
    <nav class="nav-right">
      <span class="nav-user" id="nav-user"></span>
      <a href="cart.html" class="cart-link nav-link">
        Cart <span class="cart-count" id="cart-count">0</span>
      </a>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </nav>
  </div>
</header>

<main class="container">
  <a href="index.html" class="continue-link">&larr; Continue browsing</a>
  <h1 class="cart-page-title">Your cart</h1>

  <div class="cart-layout">
    <div id="cart-items"></div>

    <div class="summary">
      <h2>Order summary</h2>
      <div class="summary-row"><span>Items</span><span id="sum-items">0</span></div>
      <div class="summary-row"><span>Shipping</span><span>Free</span></div>
      <div class="summary-total"><span>Total</span><span id="sum-total">$0.00</span></div>
      <button class="checkout-btn" id="checkout-btn">Checkout</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">&copy; 2026 Chapter &amp; Verse. A learning project.</div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/books.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script>
  requireAuth();
  document.getElementById("nav-user").textContent = "Hi, " + currentUser();
  document.getElementById("logout-btn").addEventListener("click", logoutUser);

  function render() {
    const wrap = document.getElementById("cart-items");
    const cart = getCart();

    if (cart.length === 0) {
      wrap.innerHTML = '<p class="empty-note">Your cart is empty. <a href="index.html">Go find something to read.</a></p>';
    } else {
      wrap.innerHTML = "";
      cart.forEach((line) => {
        const book = findBook(line.id);
        if (!book) return;
        const row = document.createElement("div");
        row.className = "cart-row";
        row.innerHTML = `
          <div class="cart-thumb" style="background:${book.color}"></div>
          <div>
            <div class="cart-item-title">${book.title}</div>
            <div class="cart-item-author">${book.author} · $${book.price.toFixed(2)}</div>
          </div>
          <div class="qty-control">
            <button data-action="dec" data-id="${book.id}" aria-label="Decrease quantity">&minus;</button>
            <span>${line.qty}</span>
            <button data-action="inc" data-id="${book.id}" aria-label="Increase quantity">&plus;</button>
          </div>
          <button class="remove-link" data-action="remove" data-id="${book.id}">Remove</button>
        `;
        wrap.appendChild(row);
      });

      wrap.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          const line = getCart().find((l) => l.id === Number(id));
          if (btn.dataset.action === "inc") setQty(id, line.qty + 1);
          if (btn.dataset.action === "dec") setQty(id, line.qty - 1);
          if (btn.dataset.action === "remove") removeFromCart(id);
          render();
        });
      });
    }

    const count = cartCount();
    const total = cartTotal();
    document.getElementById("sum-items").textContent = count;
    document.getElementById("sum-total").textContent = "$" + total.toFixed(2);
    document.getElementById("checkout-btn").disabled = count === 0;
  }

  document.getElementById("checkout-btn").addEventListener("click", () => {
    if (cartCount() === 0) return;
    showToast("Order placed — thank you!");
    clearCart();
    setTimeout(render, 400);
  });

  updateCartCount();
  render();
</script>
</body>
</html>
